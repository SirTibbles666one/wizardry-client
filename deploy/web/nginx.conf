# /etc/nginx/sites-available/wizardry-web — the web app at wizardry.slothlee.xyz.
# The build (`npm run build`, the `dist/` folder) is copied to /var/www/wizardry.
# Get the certificate first:
#   certbot certonly --nginx -d wizardry.slothlee.xyz
# then link this file into sites-enabled, `nginx -t`, and reload.

server {
    listen 80;
    listen [::]:80;
    server_name wizardry.slothlee.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wizardry.slothlee.xyz;

    ssl_certificate     /etc/letsencrypt/live/wizardry.slothlee.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wizardry.slothlee.xyz/privkey.pem;

    root /var/www/wizardry;
    index index.html;

    # The page carries its own policy as a meta tag; this adds what a meta tag cannot.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Hashed file names never change, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Must be read fresh, or a browser keeps running an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Extensionless, and fetched by Apple without following redirects.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # Every other path is a route inside the app.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
