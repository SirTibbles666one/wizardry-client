# /etc/nginx/sites-available/wizardry-accounts — the account server's vhost.
# Replace accounts.example.com (four places), get the certificate first:
#   certbot certonly --nginx -d accounts.example.com
# then link this file into sites-enabled, `nginx -t`, and reload.

limit_req_zone $binary_remote_addr zone=wizardry_accounts:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name accounts.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name accounts.example.com;

    ssl_certificate     /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;

    # The server logs nothing per request; nginx should not keep what it leaves out.
    access_log off;

    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location = /healthz { proxy_pass http://127.0.0.1:8787; }

    location /v1/ {
        limit_req zone=wizardry_accounts burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Set, not appended: a caller cannot pick the address its rate limits are counted against.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / { return 404; }
}
