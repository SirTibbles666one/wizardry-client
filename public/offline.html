<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18271c" />

    <title>Wizardry</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: #18271c; color: #e6eee2; text-align: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 26rem; }
      svg { width: 96px; height: 96px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; }
      p { margin: 0 0 28px; color: #b3c4ae; }
      a {
        display: inline-block; min-height: 44px; padding: 10px 22px; box-sizing: border-box;
        border-radius: 12px; background: #e0b45c; color: #16241a; font-weight: 600; text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #e6eee2; outline-offset: 3px; }
    </style>
  </head>
