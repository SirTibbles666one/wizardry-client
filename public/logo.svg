<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wizardry">
  <title>Wizardry</title>
  <!--
    The Wizardry mark: a honey diamond with an open centre, a hairline cross and a
    solid core. This SVG is the single source of truth for every raster app icon and
    splash — scripts/gen-icons.mjs fans it out to public/, android/, ios/ and electron/.
    Keep the path data in sync with the animated copies in
    src/components/brand/ArmadaCrest.tsx and index.html's boot splash (all three share
    these exact strings).
  -->
  <defs>
    <linearGradient id="wizardry-honey" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0c877"/>
      <stop offset="1" stop-color="#d99f3f"/>
    </linearGradient>
  </defs>

  <!-- The hairline cross, under the diamond. -->
  <g fill="#e4efe2" fill-opacity="0.34">
    <path d="M62.6 30h2.8v68h-2.8z"/>
    <path d="M30 62.6h68v2.8h-68z"/>
  </g>

  <!-- The diamond, open in the middle. -->
  <path d="M64 10L114 64L64 118L14 64Z M64 30L94 64L64 98L34 64Z" fill="url(#wizardry-honey)" fill-rule="evenodd"/>

  <!-- The core. -->
  <path d="M64 54a10 10 0 1 0 0 20a10 10 0 1 0 0-20z" fill="url(#wizardry-honey)"/>
</svg>
